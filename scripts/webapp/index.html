<!doctype html>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  /* PWA palette: navy, warm accent and cool comparison graphics. */
  :root {--bg:#101720;--panel:#19232f;--panel2:#243344;--surface:#1c2937;--stripe:#1e2b39;--line:#3c5065;--ink:#eef4fb;--dim:#b3c2d2;--mid:#7ecfe1;--home:#80c8ef;--away:#edb476;--good:#85cfb1;--radius:14px;--accent:#e3a66c;--warn:#e4c371;--bad:#f09787;--heat:227,166,108;--on-accent:#1a140e;--tap:44px;color-scheme:dark}
  @media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#eef2f6;--panel:#fff;--panel2:#e8eef5;--surface:#f6f9fc;--stripe:#f3f6fa;--line:#c4d0dd;--ink:#1b2b3e;--dim:#50647a;--accent:#995020;--heat:153,80,32;--mid:#167287;--home:#236ba1;--away:#975419;--good:#237454;--warn:#9a7414;--bad:#9e3328;--on-accent:#fff;color-scheme:light}}
  :root[data-theme=light]{--bg:#eef2f6;--panel:#fff;--panel2:#e8eef5;--surface:#f6f9fc;--stripe:#f3f6fa;--line:#c4d0dd;--ink:#1b2b3e;--dim:#50647a;--accent:#995020;--heat:153,80,32;--mid:#167287;--home:#236ba1;--away:#975419;--good:#237454;--warn:#9a7414;--bad:#9e3328;--on-accent:#fff;color-scheme:light}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh;
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  a{color:inherit}
  .wrap{max-width:1280px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  h2{font-size:15px;margin:0 0 10px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
  .note{color:var(--dim);font-size:12.5px;margin:6px 0 0}
  .err{color:var(--bad)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;min-width:0}
  .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .grow{flex:1 1 auto}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
  select,input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;min-height:36px}
  input[type=number]{width:92px}
  button,.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;font-size:13px;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  button.ghost,.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:500}
  #pwa-update[hidden]{display:none}
  button:disabled{opacity:.45;cursor:default}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* shell */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand svg{width:30px;height:30px;border-radius:8px;flex:none}
  .brand small{display:block;color:var(--dim);font-size:11.5px;font-weight:400;letter-spacing:0}
  .actions{display:flex;gap:8px}
  .actions button{min-width:var(--tap)}
  .mainnav{display:flex;gap:6px;margin:0 0 16px}
  .mainnav a{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:500;min-height:38px;display:inline-flex;align-items:center;justify-content:center}
  .mainnav a[aria-current=page]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
  .crumb{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;text-decoration:none;margin:0 0 12px;min-height:32px}
  .crumb:hover{color:var(--ink)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:20px;font-size:11px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;line-height:1.6}
  .pill.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
  .pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
  .pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
  .model-note{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 14px;font-size:12px;color:var(--dim)}
  .loading{color:var(--dim);padding:30px 0;text-align:center}
  img.logo{width:28px;height:28px;object-fit:contain;flex:none}
  img.logo.sm{width:20px;height:20px}
  img.logo.lg{width:44px;height:44px}
  .tabular{font-variant-numeric:tabular-nums}
  .dim{color:var(--dim)}
  .up{color:var(--good)} .down{color:var(--bad)}

  /* segmented controls */
  .seg{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px;padding:4px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);width:fit-content;max-width:100%}
  .seg button{background:transparent;color:var(--dim);border:1px solid transparent;font-weight:500;padding:5px 12px;min-height:32px}
  .seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
  .controls .seg{margin:0}
  /* grouped controls (owner, 20 Nov: stacking and grouping): a small label over each group; groups wrap as units */
  .seg-groups{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin:0 0 12px}
  .seg-group{display:flex;flex-direction:column;gap:3px;min-width:0}
  .seg-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding-left:4px;font-weight:600}
  .seg-groups .seg{margin:0}
  .preset-groups{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;margin-top:8px}
  .preset-groups .chips{margin:0}
  .wins-pick{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .wins-pick input{width:72px}

  /* Roster: minutes share on a common 48-minute scale. */
  .minbar{display:block;position:relative;width:150px;height:9px;background:var(--panel2);border-radius:5px;margin:8px 0}
  .minbar .s{display:block;height:100%;background:var(--dim);opacity:.55;border-radius:5px}
  .minbar .t{position:absolute;top:-3px;height:15px;width:3px;background:var(--accent)}
  .roster .inj{display:block;white-space:normal;max-width:220px;font-size:11px;color:var(--dim)}
  .roster .grp td{background:var(--panel2);text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em}
  .roster-toggle{border:0;background:transparent;color:inherit;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-align:left}
  .roster-toggle span{color:var(--accent);margin-left:6px}
  .acc{color:var(--accent)}
  .picture{margin-top:20px}.picture-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
  .bracket{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bracket-pair{padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface)}
  .bracket-team{display:flex;align-items:center;gap:8px;min-height:32px}.bracket-team b{margin-left:auto;font-variant-numeric:tabular-nums}.bracket-team small{color:var(--dim)}
  @media(max-width:700px){.picture-grid{grid-template-columns:1fr}.bracket{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}}
  .mini-wins{display:block;width:180px;height:34px}.mini-wins rect{fill:var(--dim);opacity:.65}.mini-wins line{stroke:var(--accent);stroke-width:2}
  .season-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .race-axis{display:grid;grid-template-columns:100px repeat(5,1fr);font-size:10px;color:var(--dim);margin:12px 90px 8px 0}.race-axis span:not(:first-child){text-align:right}
  .race-row{display:grid;grid-template-columns:90px 1fr 85px;gap:10px;align-items:center;min-height:42px;border-top:1px solid var(--line)}
  .race-row>span{text-align:right;font-variant-numeric:tabular-nums}.race-row small{color:var(--dim);margin-left:4px}
  .race-track{height:26px;position:relative;background:repeating-linear-gradient(to right,transparent 0,transparent calc(24.39% - 1px),var(--line) 24.39%)}
  .race-track i{position:absolute;top:50%;transform:translateY(-50%);border-radius:6px;background:var(--accent)}
  .race-band{height:3px;opacity:.6}.race-iqr{height:9px;opacity:.55}.race-track .race-mean{width:8px;height:16px;transform:translate(-50%,-50%)}
  @media(max-width:700px){.season-grid{grid-template-columns:1fr}.race-row{grid-template-columns:65px 1fr 70px;gap:6px;font-size:12px}.race-row small{display:block}.race-axis{grid-template-columns:65px repeat(5,1fr);margin-right:70px}}
  .mover-card{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;border-top:1px solid var(--line)}
  .result-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 20px}.result-list a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;border-top:1px solid var(--line);padding:10px 0}.result-list small{color:var(--dim)}
  .leaders-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.leader-list{margin:0;padding-left:24px}.leader-list li{padding:0 0 0 3px;color:var(--dim)}
  .leader-list li>a,.leader-list li>div{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}.leader-list small{display:block;color:var(--dim);font-size:11px}.leader-list b{font-variant-numeric:tabular-nums}
  @media(max-width:1000px){.leaders-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.leaders-grid{grid-template-columns:1fr}}
  a.pill{text-decoration:none}a.pill:hover{text-decoration:underline}.guide-intro{font-size:22px;line-height:1.4;max-width:760px;margin:8px 0 12px}.guide p,.guide li{line-height:1.75;max-width:90ch}.guide h2{margin-bottom:12px}.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}.guide li{margin-bottom:8px}
  @media(max-width:700px){.guide-grid{grid-template-columns:1fr}.guide-intro{font-size:19px}}
  .min-values{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}.min-values b{color:var(--accent)}
  .race-axis{grid-template-columns:90px 1fr 85px;gap:10px;margin:12px 0 8px}.race-axis span:not(:first-child){text-align:initial}.race-scale{position:relative;height:18px}.race-scale span{position:absolute;transform:translateX(-50%)}
  .controls>.seg-groups{margin:0}.seg-group .seg{height:100%}a.pill{min-height:28px}
  @media(max-width:700px){.race-axis{grid-template-columns:65px 1fr 70px;gap:6px;margin-right:0}.controls>.seg-groups{width:100%}.controls>.seg-groups .seg-group{width:100%}}
  /* today */
  .daybar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
  .daynav{display:flex;align-items:center;gap:6px}
  .daynav button{min-width:40px;padding:8px 10px}
  .daybar h2{margin:0;font-size:18px;letter-spacing:-.01em}
  .section-title{font-size:15px;margin:12px 0}
  .section-heading{justify-content:space-between}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:16px}
  .game-card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;transition:border-color .12s}
  /* spotlight (owner, 20 Nov): headliner and breakout full width, the six leaders on the game-card grid */
  .spot{display:flex;gap:16px;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;transition:border-color .12s;min-width:0}
  a.spot:hover,.spot a:hover{border-color:var(--accent)}
  .spot.wide{grid-column:1/-1;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .spot-id{display:flex;flex-direction:column;gap:2px;min-width:200px}
  .spot-kicker{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
  .spot-name{font-size:18px}
  .spot-meta{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .spot-chips{flex-basis:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .spot-chips span{display:flex;align-items:baseline;justify-content:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:10.5px;color:var(--dim);font-weight:600;letter-spacing:.04em;white-space:nowrap}
  .spot-chips b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0}
  .spot-side{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 1 220px}
  svg.spark{width:180px;height:54px;overflow:visible} svg.spark rect{fill:var(--accent);opacity:.75} svg.spark line{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2}
  svg.spark text{font-size:9px;fill:var(--dim)}
  .spot-chance{display:grid;grid-template-columns:repeat(2,auto);gap:2px 12px;font-size:11.5px;color:var(--dim)} .spot-chance b{color:var(--ink);font-variant-numeric:tabular-nums}
  .spot-why{font-size:12px;color:var(--ink);margin-top:2px}
  .spot-dumb{flex:1 1 300px;max-width:520px;display:flex;flex-direction:column;gap:5px}
  .db-row{display:grid;grid-template-columns:34px 1fr 128px;gap:8px;align-items:center;font-size:12px}
  .db-l{color:var(--dim);font-weight:600;font-size:10.5px;letter-spacing:.05em}
  .db-track{position:relative;height:12px;border-bottom:1px solid var(--line)}
  .db-track i{position:absolute;top:50%}
  .db-line{height:2px;background:var(--accent);opacity:.5;transform:translateY(-50%)}
  .db-s,.db-t{width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%)}
  .db-s{background:var(--dim)} .db-t{background:var(--accent)}
  .db-v{font-variant-numeric:tabular-nums;color:var(--dim)} .db-v b{color:var(--ink)} .db-v em{font-style:normal;font-weight:600;margin-left:3px}
  .db-key{font-size:10.5px;color:var(--dim);margin:2px 0 0;display:flex;align-items:center;gap:6px}
  .db-key i{display:inline-block;width:9px;height:9px;border-radius:50%} .db-key .db-s{background:var(--dim);transform:none} .db-key .db-t{background:var(--accent);transform:none}
  .ld-lead{font-size:10.5px;color:var(--dim)} .ld-p{font-size:10px;color:var(--dim);margin-right:4px}
  .ld-row{grid-template-columns:14px 18px 1fr auto auto !important}
  .spot.roles{grid-column:1/-1;flex-direction:column;gap:6px}
  .role-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px}
  .role{display:grid;grid-template-columns:18px auto auto 1fr;gap:2px 6px;align-items:center;text-decoration:none;color:inherit;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
  .role em{font-style:normal;font-weight:700;font-size:12px} .role small{grid-column:2/-1;color:var(--dim);font-size:11px}
  .review .tiles{grid-template-columns:repeat(3,minmax(0,1fr))} .review .tile b{font-size:15px}
  .rv-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-top:10px}
  .rv-p{display:grid;grid-template-columns:18px 1fr auto;gap:2px 6px;align-items:center;text-decoration:none;color:inherit;padding:4px 0;border-top:1px solid var(--line);font-size:13px}
  .rv-p b{font-size:15px;font-variant-numeric:tabular-nums} .rv-p small{grid-column:2/-1;color:var(--dim);font-size:11px}
  .form-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px} .form-grid h4{margin:0 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  svg.trend .w{fill:#5aa86e;opacity:.75} svg.trend .l{fill:#d25a50;opacity:.75}
  .fx{display:flex;flex-direction:column} .fx-g{display:grid;grid-template-columns:1.2fr 1fr 56px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;font-size:13px}
  .fx-o{display:flex;align-items:center;gap:4px} .fx-p{text-align:center;border-radius:5px;padding:2px 0;font-weight:600;font-variant-numeric:tabular-nums}
  .fx-p[data-side=w]{background:rgba(90,168,110,calc(.15 + .55 * var(--a)))} .fx-p[data-side=l]{background:rgba(210,90,80,calc(.15 + .55 * var(--a)))}
  svg.mini{width:60px;height:18px;vertical-align:middle} svg.mini rect{fill:var(--accent);opacity:.7} td.trend-c em{font-style:normal;font-weight:600;font-size:11px;margin-left:4px}
  .movers{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px} .mv{display:grid;grid-template-columns:18px 1fr auto;gap:2px 6px;align-items:center;text-decoration:none;color:inherit;padding:4px 0;border-top:1px solid var(--line);font-size:13px}
  @media(max-width:600px){.movers{grid-template-columns:1fr}}
  .mv em{font-style:normal;font-weight:700} .mv small{grid-column:2/-1;color:var(--dim);font-size:11px}
  h4.sub-h{margin:12px 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .shot-grid{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:16px;align-items:start}
  svg.court{width:100%;height:auto;border-radius:8px;background:var(--surface)} svg.court .lines{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.55}
  svg.court text{font-size:12px;fill:var(--ink)} svg.court .m{font-weight:700;font-size:14px}
  svg.trend{width:100%;height:auto;margin-top:6px} svg.trend text{font-size:10px;fill:var(--dim)} svg.trend .bar{fill:var(--accent);opacity:.55}
  svg.trend .dnp{fill:var(--line)} svg.trend .roll{fill:none;stroke:var(--ink);stroke-width:2} svg.trend .season{stroke:var(--dim);stroke-dasharray:4 3}
  .tile small em{font-style:normal;font-weight:600}
  .ff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px} .ff-grid h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}
  .ff-row{display:grid;grid-template-columns:120px 1fr 170px;gap:8px;align-items:center;font-size:12px;padding:5px 0;border-top:1px solid var(--line)}
  .ff-l{color:var(--dim)} .ff-track{position:relative;height:14px;border-bottom:1px solid var(--line)}
  .ff-track i{position:absolute;top:50%;transform:translate(-50%,-50%)}
  .ff-o,.ff-key.o{width:11px;height:11px;border-radius:50%;background:var(--accent)} .ff-d,.ff-key.d{width:11px;height:11px;border-radius:2px;background:var(--home,#9cc3ec)}
  .ff-lg,.ff-key.l{width:2px;height:16px;background:var(--dim)} .ff-v{font-variant-numeric:tabular-nums} .ff-v em{font-style:normal;font-weight:600;margin-left:4px;font-size:11px}
  i.ff-key{display:inline-block;vertical-align:-1px} i.ff-key.l{height:10px}
  .av-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px} .av-grid h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}
  .av-row{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
  .av-row .av-num.dim{grid-column:1/-1;font-size:11px;color:var(--dim)} .pill.warn{border-color:#c9a227;color:#c9a227}
